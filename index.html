<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%231f5f8b%27 d=%27M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z%27/%3E%3C/svg%3E"><title>Атлас блока безопасности</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: an engineer's binder. Fixed index rail on the left, one working view at a time. Colour follows the project's own diagrams: blue = process, green = durable storage, amber = security boundary, pink = volatile memory. */
:root{
  --bg:#f5f7f9;--panel:#ffffff;--ink:#12283a;--muted:#536a7c;--line:#d5dee6;--accent:#1f5f8b;--accent-ink:#ffffff;
  --proc:#edf3f9;--proc-ink:#23506f;--store:#e4f1ea;--store-ink:#1e6242;--sec:#fdf0dc;--sec-ink:#8a5410;--vol:#f9e6ee;--vol-ink:#92305c;
  --bad:#b3362b;--good:#1e7a50;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a23;--panel:#16242f;--ink:#e6eef4;--muted:#9db1c0;--line:#2b3f4e;--accent:#6fb3dd;--accent-ink:#08202f;
  --proc:#1c3345;--proc-ink:#a9cfe8;--store:#17382a;--store-ink:#8fd7b1;--sec:#3b2c13;--sec-ink:#efc27f;--vol:#3a1c2b;--vol-ink:#efa3c5;--bad:#ef8a7f;--good:#6fd0a0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a23;--panel:#16242f;--ink:#e6eef4;--muted:#9db1c0;--line:#2b3f4e;--accent:#6fb3dd;--accent-ink:#08202f;
  --proc:#1c3345;--proc-ink:#a9cfe8;--store:#17382a;--store-ink:#8fd7b1;--sec:#3b2c13;--sec-ink:#efc27f;--vol:#3a1c2b;--vol-ink:#efa3c5;--bad:#ef8a7f;--good:#6fd0a0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--line);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;line-height:1.25;margin-bottom:4px}
.brand-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
nav button{display:flex;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:500 14px/1.3 var(--sans);padding:8px 9px;border-radius:6px;cursor:pointer}
nav button span{font:12px var(--mono);color:var(--muted);min-width:22px}
nav button:hover{background:var(--proc)}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav button[aria-current="true"] span{color:inherit}
.navgroup{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 9px 5px}
main{padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1180px}
h1{font-size:27px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h2{font-size:17px;margin:0 0 8px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.note{font-size:13px;color:var(--muted);margin-top:14px;max-width:80ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.mono{font-family:var(--mono);font-size:.92em}
code{font-family:var(--mono);font-size:.9em;background:var(--proc);color:var(--proc-ink);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:end;margin-bottom:16px}
.rung{border:1px solid var(--line);border-radius:6px 6px 0 0;background:var(--panel);color:var(--ink);font:500 12.5px/1.2 var(--sans);padding:7px 6px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;min-width:0;overflow-wrap:anywhere}
.rung b{font:500 11px var(--mono);opacity:.75;margin-bottom:auto}
.rung.vol{background:var(--vol);color:var(--vol-ink)}.rung.proc{background:var(--proc);color:var(--proc-ink)}.rung.store{background:var(--store);color:var(--store-ink)}.rung.sec{background:var(--sec);color:var(--sec-ink)}
.rung[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.facts{display:grid;grid-template-columns:128px minmax(0,1fr);gap:7px 12px;margin:0}
.facts dt{color:var(--muted);font-size:13px}.facts dd{margin:0}
.pill{display:inline-block;font:500 12px/1.5 var(--mono);padding:1px 7px;border-radius:99px;background:var(--proc);color:var(--proc-ink);overflow-wrap:anywhere}
.pill.store{background:var(--store);color:var(--store-ink)}.pill.sec{background:var(--sec);color:var(--sec-ink)}.pill.vol{background:var(--vol);color:var(--vol-ink)}
.pill.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}.pill.good{background:transparent;border:1px solid var(--good);color:var(--good)}
.thumb{display:block;width:100%;max-width:560px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in;padding:6px}
.thumb img{display:block;width:100%;height:auto}
/* budget */
.budget{display:flex;height:40px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-top:8px}
.budget div{display:flex;align-items:center;justify-content:center;font:500 12px var(--mono);border-right:1px solid var(--panel);min-width:0;overflow:hidden}
.bscale{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--muted);margin-top:3px}
.bkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
/* scenarios */
.split{display:grid;grid-template-columns:262px minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column;gap:3px}
.list button{border:1px solid transparent;background:none;color:var(--ink);text-align:left;font:500 14px/1.3 var(--sans);padding:8px 10px;border-radius:6px;cursor:pointer}
.list button:hover{background:var(--proc)}
.list button[aria-pressed="true"]{background:var(--panel);border-color:var(--accent)}
.list small{display:block;font:11.5px var(--mono);color:var(--muted);margin-top:1px}
ol.steps{margin:6px 0 0;padding-left:21px}ol.steps li{margin-bottom:5px}
.triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.triple div{border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.triple small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
/* calc */
.calc{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.field{margin-bottom:13px}.field label{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:3px}
.field output{font:500 13px var(--mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:6px;font:500 13px var(--sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.res .panel{padding:12px 14px}
.res b{display:block;font:600 23px/1.2 var(--sans);font-variant-numeric:tabular-nums}
.res small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.cmp{margin-top:6px}
.cmpr{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 92px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.cmpr:first-child{border-top:0}
.bar{height:16px;background:var(--proc);border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.cmpr em{font-style:normal;font:500 12.5px var(--mono);text-align:right}
.cmpr small{display:block;color:var(--muted);font-size:12px}
/* access */
.selrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end;margin-bottom:12px}
select,input[type=search]{width:100%;font:14px var(--sans);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:13px var(--sans);padding:4px 10px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.verdict{font-size:19px;font-weight:600;margin:0 0 4px}
/* atlas */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0;overflow:hidden;cursor:zoom-in;text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.card span.im{display:flex;align-items:center;justify-content:center;background:#fff;height:160px;padding:8px}
.card img{max-height:100%;max-width:100%}
.card span.tx{padding:9px 12px;font-size:13.5px;line-height:1.3;border-top:1px solid var(--line)}
.card b{font:500 12px var(--mono);color:var(--muted);display:block}
dialog{border:0;border-radius:8px;padding:0;width:min(1200px,96vw);max-height:94vh;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(8,20,30,.72)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dh button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:4px 12px;font:14px var(--sans);cursor:pointer}
.dimg{background:#fff;padding:10px;overflow:auto}.dimg img{display:block;width:100%;height:auto;margin:auto}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 11px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top;min-width:90px}
tr:last-child td{border-bottom:0}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.terms .panel{padding:11px 14px}.terms b{display:block;margin-bottom:2px}.terms p{margin:0;font-size:13.5px;color:var(--muted)}
.folders{display:grid;gap:10px}
.fold{display:grid;grid-template-columns:150px 60px minmax(0,1fr) auto;gap:12px;align-items:center}
.fold button{border:1px solid var(--line);background:none;color:var(--accent);border-radius:6px;padding:5px 11px;font:500 13px var(--sans);cursor:pointer;white-space:nowrap}
.focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:14px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .navgroup{display:none}.navwrap{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}nav button span{display:none}.brand-sub{margin-bottom:10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.split,.calc{grid-template-columns:minmax(0,1fr)}.ladder{grid-template-columns:repeat(3,minmax(0,1fr))}.rung{border-radius:6px;min-height:58px}
  .res,.triple{grid-template-columns:minmax(0,1fr)}.selrow{grid-template-columns:minmax(0,1fr)}.fold{grid-template-columns:minmax(0,1fr)}
  .cmpr{grid-template-columns:minmax(0,1fr) 84px}.cmpr .bar{grid-column:1/-1;grid-row:2}
}
</style>

4", "title": "Дедлайн 5 секунд"}, {"id": "A05", "title": "Архив и очистка"}, {"id": "A06", "title": "Переключение ЦОД"}, {"id": "A07", "title": "Обновление правил и перечней"}, {"id": "A08", "title": "Восстановление после повреждения"}], "glossary": [["АБС", "Банковская система, которая ведёт счета и исполняет операции. Наш комплекс получает события и возвращает результат мониторинга."], ["АПК", "Аппаратно-программный комплекс: серверы, сеть, хранилища и программные сервисы вместе."], ["ЦО / ЦОД", "Центральный офис / центр обработки данных. Площадка ЦОД содержит вычислительные и сетевые узлы."], ["APP / COM", "Сервис приложения / коммуникационная роль передачи сообщений. Роли могут размещаться на одних физических узлах."], ["Ingress", "Контролируемая точка входа запросов в центральные сервисы."], ["МЭ / NGFW", "Межсетевой экран. Разрешает и запрещает сетевые обращения по политике."], ["СКЗИ", "Средство криптографической защиты. Защищает канал и подтверждает стороны в пределах возможностей выбранного изделия."], ["VLAN", "Логический сегмент Ethernet. Сам по себе не ограничивает всё общение внутри одного сегмента."], ["ACL", "Набор правил доступа. В макете правила проверяют адреса, протоколы и порты."], ["mTLS", "TLS, при котором обе стороны подтверждают себя сертификатами."], ["MFA", "Вход с несколькими факторами, например паролем и отдельным подтверждением."], ["PAM", "Контролируемый доступ администраторов с ограничением прав и учётом сессий."], ["SIEM", "Сбор и сопоставление событий безопасности для обнаружения и разбора инцидентов."], ["Outbox", "Сохранённая очередь сообщений рядом с бизнес-данными. Транзакция сохраняет данные и намерение отправить сообщение вместе."], ["ACK", "Подтверждение. Его смысл зависит от типа: приём, фиксация решения или разрешение очистки."], ["Идемпотентность", "Повтор того же запроса не создаёт второй эффект. Ключ и хеш помогают отличить повтор от конфликта."], ["Hash", "Контрольный отпечаток содержимого. Обнаруживает изменение при наличии доверенного эталона, но сам не запрещает удаление."], ["Commit", "Фиксация транзакции. Уровень сохранности зависит от настроек и фактически подтвердивших реплик."], ["WAL", "Журнал изменений PostgreSQL, используемый для восстановления и передачи изменений репликам."], ["Replica / standby", "Копия базы на другом узле. Синхронная копия участвует в подтверждении записи, асинхронная может отставать."], ["Writer / primary", "Узел, который имеет право изменять данные. Для одной области данных одновременно разрешён один writer."], ["Fencing", "Надёжная изоляция старого активного узла, чтобы после переключения он не продолжил запись."], ["Кворум / DCS", "Большинство голосов / распределённое хранилище координации. Нужны для согласованного права на активную роль."], ["RPO", "Допустимая потеря подтверждённых данных, обычно выраженная временем. RPO 0 требует сохранности всех подтверждённых записей в оговорённом сценарии."], ["RTO", "Допустимое время восстановления функции после отказа. Это не задержка обычной операции."], ["p99", "Задержка, в которую уложились 99% измеренных операций. Остальной процент и максимум тоже нужно анализировать."], ["Replay / backlog", "Досылка / накопленная очередь. Досылку ограничивают, чтобы она не вытесняла текущие операции."], ["WORM / legal hold", "Запрет изменения/удаления в срок хранения / приостановка удаления из-за основания, например расследования."], ["HSRP", "Резервирование шлюза Cisco. Хост использует виртуальный адрес, активную роль принимает один из маршрутизаторов."], ["OSPF", "Протокол обмена маршрутами. Выбирает путь по метрике и перестраивает его после обнаружения изменения сети."], ["RAID1", "Зеркало дисков. Полезная ёмкость пары равна ёмкости одного диска. Это не самостоятельный backup."], ["PITR", "Восстановление базы на выбранный момент с помощью базовой копии и журнала изменений."]], "hosts": [{"Хост": "ABS", "IP": "10.1.10.10", "Маска": "255.255.255.0", "Шлюз": "10.1.10.1", "VLAN": "10", "Коммутатор": "SW-BR-A", "Порт":  const raw=peak*86400*p.buffer_days*s,buf=raw*p.storage_overhead*p.headroom_factor;const day=total*p.hours*3600,daily=day*s;
 const rawY=daily*365*p.years,comp=rawY/p.compression_factor,useful=comp*p.archive_copies*p.archive_metadata_factor*p.headroom_factor,phys=useful*p.archive_erasure_factor;
 const hot=daily*p.hot_days*p.storage_overhead*p.headroom_factor,backlog=peak*b*3600;
 return{total,peak,stress,net:stress*s*8*p.network_factor/1e9,raw,buf,daily,rawY,comp,useful,phys,hot,backlog,replay:backlog/p.replay_per_second/3600,restore:hot/5e9/3600};}
